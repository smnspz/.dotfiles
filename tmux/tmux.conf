# ═══════════════════════════════════════════════════════════════════════════
# tmux.conf — portable across macOS / Linux and any modern terminal.
# Stowed to ~/.config/tmux/tmux.conf by the dotfiles `tmux` package.
#
# Order matters: @catppuccin_* options must precede the TPM run, and the
# status line must follow it (catppuccin bakes window formats with `set -gF`
# at load time, so options set afterwards are frozen out).
# ═══════════════════════════════════════════════════════════════════════════

# ── Reload ────────────────────────────────────────────────────────────────
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "reloaded"

# ── Prefix ────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# ── Terminal capabilities ─────────────────────────────────────────────────
# Give applications a correct 256-colour terminfo; fall back when the entry is
# missing (minimal containers, some BSDs). Do not add -b: the branch must
# resolve before the first pane is created, or panes inherit TERM=screen.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Advertise true colour to applications (COLORTERM=truecolor).
set -as terminal-features ',*:RGB'

# OSC 52: copying in tmux writes the clipboard of whatever terminal is
# attached — macOS, X11, Wayland, Windows Terminal, and across SSH.
set -g set-clipboard on

# Shift+Enter / Ctrl+Enter reach the program in the pane (nvim, pi).
# Keep the default "xterm" (modifyOtherKeys) format: csi-u needs tmux >= 3.5
# and an outer terminal that speaks it.
set -g extended-keys on

# Let nvim see FocusGained/FocusLost (drives the autosave-on-blur).
set -g focus-events on

# Never split an escape sequence in the middle of a key.
set -sg escape-time 0

# ── Behaviour ─────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
set -g status-justify centre
setw -g mode-keys vi
bind-key \; last-window

# ── Panes ─────────────────────────────────────────────────────────────────
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# No-prefix C-hjkl: forward the key to vim-like programs and to ssh/mosh
# panes, where the foreground process is only `ssh` and the remote nvim is
# invisible to local tmux. Otherwise switch panes.
# `#{pane_tty}` is /dev/ttys001 on macOS and /dev/pts/0 on Linux; BSD ps
# wants it without the /dev/ prefix, GNU ps accepts both.
is_vim_or_ssh='tty=$(printf %s "#{pane_tty}" | sed "s|^/dev/||"); ps -o state= -o comm= -t "$tty" | grep -iqE "^[^TXZ ]+ +([^ ]*/)?(g?(view|n?vim?x?)(diff)?|ssh|mosh(-client)?)$"'
bind -n C-h if-shell "$is_vim_or_ssh" 'send-keys C-h' 'select-pane -L'
# C-j is left unbound on purpose so a bare newline (LF) reaches the program
# running in the pane (e.g. Kiro). Pane-down is still on `prefix + j`.
bind -n C-k if-shell "$is_vim_or_ssh" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim_or_ssh" 'send-keys C-l' 'select-pane -R'

# Resize panes: Alt moves 5 cells, Ctrl moves 1, both repeatable.
bind -r -T prefix M-Up    resize-pane -U 5
bind -r -T prefix M-Down  resize-pane -D 5
bind -r -T prefix M-Left  resize-pane -L 5
bind -r -T prefix M-Right resize-pane -R 5
bind -r -T prefix C-Up    resize-pane -U
bind -r -T prefix C-Down  resize-pane -D
bind -r -T prefix C-Left  resize-pane -L
bind -r -T prefix C-Right resize-pane -R

# ── Windows ───────────────────────────────────────────────────────────────
bind -r n next-window
bind -r p previous-window

# Alt, not Ctrl+Shift: legacy encodings cannot tell Ctrl+Shift+h from Ctrl+h,
# so C-S-* only works when extended keys are negotiated on both ends.
bind -n M-h previous-window
bind -n M-l next-window

# ── Copy mode ─────────────────────────────────────────────────────────────
# Prefix + / and ? enter copy mode already searching, in that direction.
bind / copy-mode \; command-prompt -i -p "(search up)"   'send -X search-backward-incremental "%%%"'
bind ? copy-mode \; command-prompt -i -p "(search down)" 'send -X search-forward-incremental "%%%"'
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse
bind -T copy-mode-vi Escape send -X cancel

# copy-selection-and-cancel + `set-clipboard on` is what reaches the system
# clipboard, so no pbcopy/xsel/wl-copy dependency is needed.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# ── Catppuccin (before TPM) ───────────────────────────────────────────────
set -g @catppuccin_flavor 'mocha'          # latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "right"
# "basic" already prepends a separator space, so keep the text free of its own
# leading space or the list gets a double indent.
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
# tmux >= 3.8 defaults window-status-current-style to "underscore", which
# draws a stray underline; catppuccin already marks the active window.
set -g window-status-current-style "default"

# ── Plugins ───────────────────────────────────────────────────────────────
# christoomey/vim-tmux-navigator is deliberately not used: it rebinds C-hjkl
# in the root table after TPM loads and would override the passthrough above,
# which additionally covers ssh/mosh panes (something navigator cannot do).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# Plugins live in the stow target, so this works wherever the repo is cloned.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
run '~/.config/tmux/plugins/tpm/tpm'

# ── Status line (after TPM: modules exist only once the plugin has loaded) ─
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{E:@catppuccin_status_session}"

set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{E:@catppuccin_status_directory}"
set -ga status-right "#{E:@catppuccin_status_date_time}"
