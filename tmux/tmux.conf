unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g prefix C-s
set -g mouse on

bind-key \; last-window

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -r -T prefix       M-Up              resize-pane -U 5
bind-key -r -T prefix       M-Down            resize-pane -D 5
bind-key -r -T prefix       M-Left            resize-pane -L 5
bind-key -r -T prefix       M-Right           resize-pane -R 5
bind-key -r -T prefix       C-Up              resize-pane -U
bind-key -r -T prefix       C-Down            resize-pane -D
bind-key -r -T prefix       C-Left            resize-pane -L
bind-key -r -T prefix       C-Right           resize-pane -R

# copy to macOS clipboard (mouse drag or 'v' + 'y')
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

# Catppuccin
set -g @catppuccin_flavor 'mocha'  # latte, frappe, macchiato, mocha

# Window list options. Catppuccin bakes these into window-status-format with
# `set -gF` at load time, so they MUST be set before tpm runs. Otherwise the
# defaults get frozen in (#T = pane title = hostname, number position = left).
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "right"
# The "basic" style already prepends a separator space, so keep the text free
# of its own leading space or the list gets a double indent.
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_default_text "#W"

# Module icons and the status separators are baked into the module strings at
# load time too, so leave them at their stock values (powerline caps + the
# session/date icons). The old "no icons" overrides existed for Terminal.app,
# which misaligns Nerd Font glyphs; Ghostty renders them correctly.

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

set -sg escape-time 0
set -g status-position top

# Extended keys so Shift+Enter / Ctrl+Enter work in pi.
# tmux 3.4 uses xterm modifyOtherKeys (pi supports it). Add 'extended-keys-format csi-u' after upgrading to 3.5+.
set -g extended-keys on

# Load TPM and plugins from the dotfiles-versioned plugin dir
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/Dev/repos/.dotfiles/tmux/plugins/"
run '$HOME/Dev/repos/.dotfiles/tmux/plugins/tpm/tpm'

# ---------- Status line (Catppuccin modules) ----------
# Session name shown via the Catppuccin session module instead of the plain [name]
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{E:@catppuccin_status_session}"

set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{E:@catppuccin_status_date_time}"

# center the window list
set -g status-justify "centre"

# Let tmux name each window after the foreground program (pane_current_command),
# so the status line shows what's actually running (nvim, opencode, ...).
# allow-rename stays off so programs can't overwrite the name via escape codes.
set -g automatic-rename on
set -g allow-rename off
